syntax = "proto3";
package lcp.service.elc.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "ibc/core/client/v1/client.proto";

option go_package = "github.com/datachainlab/lcp/go/relay/elc";
option (gogoproto.goproto_getters_all) = false;

// Msg defines the ELC Msg service.
service Msg {
  // CreateClient defines a rpc handler method for MsgCreateClient.
  rpc CreateClient(MsgCreateClient) returns (MsgCreateClientResponse);

  // UpdateClient defines a rpc handler method for MsgUpdateClient.
  rpc UpdateClient(MsgUpdateClient) returns (MsgUpdateClientResponse);

  // UpdateClientStream defines a rpc handler method for MsgUpdateClient.
  rpc UpdateClientStream(stream MsgUpdateClientStreamChunk) returns (MsgUpdateClientResponse);

  // SpeculativeUpdateClientBatchStream defines a client-streaming rpc
  // handler method for explicit-state speculative UpdateClient batch execution.
  rpc SpeculativeUpdateClientBatchStream(stream MsgSpeculativeUpdateClientBatchStreamChunk) returns (ExecuteSpeculativeUpdateClientBatchResponse);

  // AggregateMessages defines a rpc handler method for MsgAggregateMessages
  rpc AggregateMessages(MsgAggregateMessages) returns (MsgAggregateMessagesResponse);

  // VerifyMembership defines a rpc handler method for MsgVerifyMembership
  rpc VerifyMembership(MsgVerifyMembership) returns (MsgVerifyMembershipResponse);

  // VerifyNonMembership defines a rpc handler method for MsgVerifyNonMembership
  rpc VerifyNonMembership(MsgVerifyNonMembership) returns (MsgVerifyNonMembershipResponse);
}

// MsgCreateClient defines a message to create an IBC client
message MsgCreateClient {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  string client_id = 1 [(gogoproto.moretags) = "yaml:\"client_id\""];
  // light client state
  google.protobuf.Any client_state = 2 [(gogoproto.moretags) = "yaml:\"client_state\""];
  // consensus state associated with the client that corresponds to a given
  // height.
  google.protobuf.Any consensus_state = 3 [(gogoproto.moretags) = "yaml:\"consensus_state\""];
  // enclave key for signing
  bytes signer = 4;
}

// MsgCreateClientResponse defines the Msg/CreateClient response type.
message MsgCreateClientResponse {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;
 
  bytes message = 1;
  bytes signature = 2;
}

// MsgUpdateClient defines an sdk.Msg to update a IBC client state using
// the given header.
message MsgUpdateClient {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  // client unique identifier
  string client_id = 1 [(gogoproto.moretags) = "yaml:\"client_id\""];
  // header to update the light client
  google.protobuf.Any header = 2;
  // request to emit state
  bool include_state = 3;
  // enclave key for signing
  bytes signer = 4;
}

// MsgUpdateClientResponse defines the Msg/UpdateClient response type.
message MsgUpdateClientResponse {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  bytes message = 1;
  bytes signature = 2;
}

message MsgAggregateMessages {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  bytes signer = 1;
  repeated bytes messages = 2;
  repeated bytes signatures = 3;
}

message MsgAggregateMessagesResponse {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  bytes message = 1;
  bytes signature = 2;
}

message MsgVerifyMembership {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  string client_id = 1;
  bytes prefix = 2;
  string path = 3;
  bytes value = 4;
  ibc.core.client.v1.Height proof_height = 5 [(gogoproto.nullable) = false];
  bytes proof = 6;
  // enclave key for signing
  bytes signer = 7;
}

message MsgVerifyMembershipResponse {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  bytes message = 1;
  bytes signature = 2;
}

message MsgVerifyNonMembership {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  string client_id = 1;
  bytes prefix = 2;
  string path = 3;
  ibc.core.client.v1.Height proof_height = 4 [(gogoproto.nullable) = false];
  bytes proof = 5;
  // enclave key for signing
  bytes signer = 6;
}

message MsgVerifyNonMembershipResponse {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  bytes message = 1;
  bytes signature = 2;
}

message MsgUpdateClientStreamChunk {
  oneof chunk {
    UpdateClientStreamInit init = 1;
    UpdateClientStreamHeaderChunk header_chunk = 2;
  }
}

message UpdateClientStreamInit {
  string client_id = 1;
  bool include_state = 2;
  bytes signer = 3;
  string type_url = 4;
}

message UpdateClientStreamHeaderChunk {
  bytes data = 1;
}

message ExplicitStateRef {
  // Expected state metadata before executing a speculative unit. When provided,
  // prev_height and prev_state_id are checked against the transition observed
  // from the enclave response.
  ibc.core.client.v1.Height prev_height = 1;
  bytes prev_state_id = 2;
  // Client and consensus states to seed into the unit's isolated speculative
  // transaction before executing UpdateClient.
  google.protobuf.Any client_state = 3;
  google.protobuf.Any consensus_state = 4;
}

// MsgSpeculativeUpdateClientBatchStreamChunk transports one explicit-state
// speculative UpdateClient batch. A single stream starts with exactly one
// batch-level init message and then sends zero or more units in order:
//
//   init,
//   unit_init, unit_header_chunk..., unit_end,
//   unit_init, unit_header_chunk..., unit_end, ...
//
// The first implementation does not interleave chunks from multiple units.
message MsgSpeculativeUpdateClientBatchStreamChunk {
  oneof chunk {
    // Declares the batch-level client_id. All following units in this RPC
    // stream are executed for this client_id.
    SpeculativeUpdateClientBatchStreamInit init = 1;
    // Starts one speculative UpdateClient unit and carries all unit metadata
    // except the header bytes.
    SpeculativeUpdateClientUnitInit unit_init = 2;
    // Carries one bounded slice of the currently open unit's header bytes.
    SpeculativeUpdateClientUnitHeaderChunk unit_header_chunk = 3;
    // Closes the currently open unit. The receiver reconstructs a
    // MsgUpdateClient from unit_init plus all accumulated header chunks.
    SpeculativeUpdateClientUnitEnd unit_end = 4;
    // Explicitly terminates the batch. EOF without this chunk is treated as a
    // truncated stream and must not stitch a partial prefix.
    SpeculativeUpdateClientBatchEnd batch_end = 5;
  }
}

message SpeculativeUpdateClientBatchStreamInit {
  // Target client for the whole batch stream. Mixed-client batches are not
  // supported; unit messages do not carry their own client_id.
  string client_id = 1;
}

// SpeculativeUpdateClientUnitInit starts a single speculative UpdateClient work
// unit. Units form a linear chain in stream order: the first unit may start
// from an incomplete base_state and read the canonical store, but every
// following unit must provide complete base_state payloads so it can execute
// without being rebased from the previous unit's write set.
message SpeculativeUpdateClientUnitInit {
  reserved 6;

  // Unique unit identifier within this batch. It is used for diagnostics and
  // response correlation; it does not define execution dependencies.
  string unit_id = 1;
  // Type URL for the google.protobuf.Any header reconstructed from the
  // following header chunks.
  string type_url = 2;
  bool include_state = 3;
  bytes signer = 4;
  // Explicit state used as the starting view for this unit's isolated
  // speculative transaction.
  ExplicitStateRef base_state = 5 [(gogoproto.nullable) = false];
}

message SpeculativeUpdateClientUnitHeaderChunk {
  // Must match the currently open unit_id. This allows the receiver to detect
  // misplaced chunks even though chunks are not interleaved.
  string unit_id = 1;
  // Raw bytes appended to the reconstructed google.protobuf.Any header value.
  bytes data = 2;
}

message SpeculativeUpdateClientUnitEnd {
  // Must match the currently open unit_id.
  string unit_id = 1;
}

message SpeculativeUpdateClientBatchEnd {}

// ObservedStateTransition is decoded from the enclave UpdateClient response.
// It records the actual state transition used by a speculative unit, not merely
// caller-provided expectations. The service compares prev_* with base_state and
// the previous unit's post_* values before stitching.
message ObservedStateTransition {
  ibc.core.client.v1.Height prev_height = 1;
  bytes prev_state_id = 2;
  ibc.core.client.v1.Height post_height = 3 [(gogoproto.nullable) = false];
  bytes post_state_id = 4;
}

// Per-unit result returned only after the batch has been validated and its
// merged write set has been applied to the canonical store.
message StitchedSpeculativeUpdateClientUnitResult {
  MsgUpdateClientResponse response = 1 [(gogoproto.nullable) = false];
  ObservedStateTransition observed_transition = 2 [(gogoproto.nullable) = false];
}

message ExecuteSpeculativeUpdateClientBatchResponse {
  // The batch-level client_id from the request stream.
  string client_id = 1;
  // Unit results in the same order as accepted request units.
  repeated StitchedSpeculativeUpdateClientUnitResult units = 2;
}
