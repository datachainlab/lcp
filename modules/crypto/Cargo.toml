[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
sgx-types = { rev = "e860e34", git = "https://github.com/datachainlab/sgx-sdk-rs" }
sgx-trts = { rev = "e860e34", git = "https://github.com/datachainlab/sgx-sdk-rs", optional = true }
sgx-tseal = { rev = "e860e34", git = "https://github.com/datachainlab/sgx-sdk-rs", optional = true }

rand = { version = "0.8", default-features = false, optional = true }
tiny-keccak = "2.0"
serde = { version = "1.0.184", default-features = false, features = ["alloc", "derive"] }
serde-big-array = "0.5.1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
flex-error = { version = "0.4.4", default-features = false }
libsecp256k1 = { rev = "48dabd8821852c5fe00b846f6c37e1f6b05c3d8c", git = "https://github.com/paritytech/libsecp256k1", default-features = false, features = ["static-context", "hmac"] }
zeroize = { version = "1.8.1", default-features = false, features = ["alloc", "zeroize_derive"] }

[features]
default = ["std"]
std = [
    "rand/default",
    "flex-error/std"
]
sgx = [
    "sgx-trts",
    "sgx-tseal"
]
