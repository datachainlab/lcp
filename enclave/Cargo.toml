[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "proxy_enclave"
crate-type = ["staticlib"]

[features]
default = ["panic-logging"]
panic-logging = [
    "enclave-runtime/panic-logging",
]

[dependencies]
enclave-runtime = { path = "../enclave-modules/runtime" }
tendermint-lc = { path = "../modules/tendermint-lc", default-features = false }

[build-dependencies]
sgx-build = { rev = "789b0429b4843821c27bd04d0dbe22ea7e5cbfb9", git = "https://github.com/datachainlab/sgx-sdk-rs" }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
