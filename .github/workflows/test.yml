name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
      - uses: datachainlab/rust-cache@allow_registry_src_caching
        with:
          workspaces: |
            .
            ./enclave
          cache-directories: |
            ~/.cargo/registry/src/**/librocksdb-sys-*
      - run: cargo check -r
        working-directory: enclave-modules
      - run: make lint-tools
      - run: make lint

  sdk-test:
    runs-on: ubuntu-22.04
    env:
      SGX_MODE: SW
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions-rs/toolchain@v1
        with:
            toolchain: nightly
      - uses: datachainlab/rust-cache@allow_registry_src_caching
        with:
          workspaces: |
            .
            ./enclave
          cache-directories: |
            ~/.cargo/registry/src/**/librocksdb-sys-*
      # cargo sgx build: build-std needs rust-src, and the subcommand itself.
      - run: rustup component add rust-src
      - run: cargo install --git https://github.com/datachainlab/sgx-sdk-rs --rev 789b0429b4843821c27bd04d0dbe22ea7e5cbfb9 cargo-sgx --locked
      - run: sudo bash .github/scripts/install_sgx_sdk.sh /opt/intel
      - run: source /opt/intel/sgxsdk/environment && make -B
      - run: source /opt/intel/sgxsdk/environment && make test
      - run: source /opt/intel/sgxsdk/environment && make integration-test
